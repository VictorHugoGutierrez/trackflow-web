<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="TrackFlow Web — Gestão de tempo, clientes e projetos com isolamento multi-tenant">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#131C31" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <radialGradient id="glow-emerald" cx="25%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="82%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#9333EA" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0" />
    </radialGradient>

    <pattern id="subtle-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.22" />
    </pattern>

    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="358" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="1200" height="360" fill="url(#bg-grad)" />
    <rect x="0" y="0" width="1200" height="360" fill="url(#subtle-grid)" />
    <rect x="0" y="0" width="1200" height="360" fill="url(#glow-emerald)" />
    <rect x="0" y="0" width="1200" height="360" fill="url(#glow-purple)" />

    <circle cx="110" cy="70" r="140" fill="none" stroke="#10B981" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="1090" cy="290" r="160" fill="none" stroke="#A855F7" stroke-opacity="0.08" stroke-width="1" />
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="20" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Brand Icon Badge (matching login.ejs) -->
  <rect x="566" y="48" width="68" height="68" rx="18" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.38" stroke-width="1.5" />
  <g transform="translate(582, 64) scale(1.5)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="12 6 12 12 16 14" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">TrackFlow Web</text>
  <text x="600" y="208" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Gestão de tempo, clientes e projetos com isolamento multi-tenant</text>

  <!-- Feature Pill 1: Cronômetro & Pomodoro -->
  <rect x="178" y="252" width="234" height="40" rx="20" fill="#1E293B" fill-opacity="0.9" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.2" />
  <circle cx="200" cy="272" r="4.5" fill="#10B981" />
  <text x="215" y="277" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Cronômetro &amp; Pomodoro</text>

  <!-- Feature Pill 2: Multi-Tenant SaaS -->
  <rect x="428" y="252" width="196" height="40" rx="20" fill="#1E293B" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" />
  <circle cx="450" cy="272" r="4.5" fill="#38BDF8" />
  <text x="465" y="277" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Multi-Tenant SaaS</text>

  <!-- Feature Pill 3: Relatórios & IA -->
  <rect x="640" y="252" width="180" height="40" rx="20" fill="#1E293B" fill-opacity="0.9" stroke="#A855F7" stroke-opacity="0.35" stroke-width="1.2" />
  <circle cx="662" cy="272" r="4.5" fill="#A855F7" />
  <text x="677" y="277" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Relatórios &amp; IA</text>

  <!-- Feature Pill 4: Faturamento PDF -->
  <rect x="836" y="252" width="186" height="40" rx="20" fill="#1E293B" fill-opacity="0.9" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.2" />
  <circle cx="858" cy="272" r="4.5" fill="#F59E0B" />
  <text x="873" y="277" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Faturamento PDF</text>
</svg>
